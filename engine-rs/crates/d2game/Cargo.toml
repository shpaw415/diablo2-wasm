[package]
name = "d2game"
version = "0.1.0"
edition = "2021"
description = "Rendering engine for the D2 browser MVP: DT1/DS1 map compositor + collision grid, DCC sprite composition, A*, game loop with camera — native-testable, WASM via wasm-bindgen"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
d2dcc = { path = "../d2dcc" }
d2animdata = { path = "../d2animdata" }
d2rules = { path = "../d2rules" }

[dev-dependencies]
# 15a : décodage des couches DC6 (Mephisto, cas spécial retail) dans les goldens sprites
d2dc6 = { path = "../d2dc6" }
