[package]
name = "d2rules"
version = "0.1.0"
edition = "2021"
description = "Règles de jeu pures du port Diablo 2 v1.12 WASM (MVP) : World déterministe, FSM monstres, combat, XP, drops, inventaire, save/load JSON — zéro rendu, zéro IO, zéro wasm"
license = "MIT"

[dependencies]
d2missiles = { path = "../d2missiles" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
