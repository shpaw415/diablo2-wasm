<!DOCTYPE html>
<!-- Capture E2E (d2w-fix-ui) : retarde l'événement load de ~6 s pour laisser
     le moteur WASM finir de booter dans l'iframe avant le screenshot
     firefox --headless --screenshot (qui attend load).
     ?keys=i|t : enfonce des touches dans l'iframe après le boot (I = inventaire,
     T = arbre) ; l'iframe title + erreurs __d2 sont affichés en bannière. -->
<html lang="fr">
<head><meta charset="utf-8"><title>shot</title>
<style>body{margin:0;background:#0b0b0d}iframe{width:820px;height:760px;border:0}
#banner{position:fixed;top:0;left:0;background:#4a1a10;color:#ffb59a;font:12px monospace;
        padding:2px 6px;z-index:9;max-width:820px;white-space:pre-wrap}</style></head>
<body>
<div id="banner">boot…</div>
<img src="http://localhost:8645/slow" style="display:none">
<iframe id="f"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('f').src = q.get('src') || 'game.html';
  const keys = (q.get('keys') || '').split(',').filter(Boolean);
  setTimeout(() => {
    try {
      const w = document.getElementById('f').contentWindow, d = w.document;
      for (const k of keys) {
        w.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
        d.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
      }
      const errs = (w.__d2 && w.__d2.errors) || ['__d2 absent'];
      const log = d.getElementById('msglog');
      let geom = '';
      const tree = d.getElementById('d2-tree');
      if (tree) {
        const r = tree.getBoundingClientRect();
        const cv = d.getElementById('game').getBoundingClientRect();
        const ic = tree.querySelector('.skicon');
        const ri = ic ? ic.getBoundingClientRect() : null;
        geom = `\ntree=(${Math.round(r.left - cv.left)},${Math.round(r.top - cv.top)}) ` +
          `canvas=(${Math.round(cv.left)},${Math.round(cv.top)}) ${Math.round(cv.width)}x${Math.round(cv.height)}` +
          (ri ? ` icon0=(${Math.round(ri.left - cv.left)},${Math.round(ri.top - cv.top)})` : '') +
          ` bg=${getComputedStyle(tree).backgroundImage.slice(0, 60)}`;
      }
      document.getElementById('banner').textContent =
        `mode=${w.__d2 && w.__d2.mode} erreurs=${errs.length} ` + errs.slice(0, 4).join(' | ') +
        `\nlog: ${(log ? log.textContent : '').trim().split('\n').slice(-3).join(' / ')}` + geom;
    } catch (e) { document.getElementById('banner').textContent = 'sonde: ' + e.message; }
  }, 8000);
</script>
</body></html>
