<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diablo 2 WASM — Camp des Rousses</title>
<style>
  :root { --gold: #c7a45a; --stone: #2a2620; }
  * { box-sizing: border-box; }
  body { background: #0b0b0d; color: #cfc7b8; font: 13px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0; padding: 12px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--gold); margin: 0; }
  #stage { position: relative; }
  canvas { border: 1px solid #3a3226; image-rendering: pixelated; cursor: crosshair; background: #000; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .bar { position: absolute; height: 14px; width: 180px; background: #1a1210cc; border: 1px solid #00000088;
         outline: 1px solid #5a4a2a66; }
  .bar > div { height: 100%; transition: width .15s; }
  #hpbar { left: 10px; top: 10px; }  #hpfill { background: linear-gradient(#c0392b, #7e1f14); width: 100%; }
  #mpbar { right: 10px; top: 10px; } #mpfill { background: linear-gradient(#2e6db4, #1a3f6e); width: 100%; }
  #xpwrap { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 320px; height: 8px;
            background: #1a1210cc; border: 1px solid #00000088; }
  #xpfill { height: 100%; background: linear-gradient(#b3925a, #6e5626); width: 0%; }
  .hudtext { position: absolute; font-size: 11px; text-shadow: 0 1px 2px #000; color: #e8dcbf; }
  #hptext { left: 14px; top: 11px; } #mptext { right: 14px; top: 11px; }
  #lvltext { left: 10px; top: 28px; color: var(--gold); }
  #goldtext { right: 10px; top: 28px; color: var(--gold); }
  #toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #241d12; color: var(--gold); border: 1px solid #5a4a2a; padding: 5px 14px;
           font: 600 12px system-ui; letter-spacing: .04em; cursor: pointer; }
  button:hover { background: #38290f; }
  #status { min-height: 2.2em; max-width: 820px; text-align: center; color: #8f8676; }
  #status.err { color: #d06b4f; font-weight: 600; }
  #errlog { max-width: 820px; width: 820px; max-height: 90px; overflow-y: auto; font: 11px/1.5 monospace;
            color: #d06b4f; background: #170c0a; border: 1px solid #3a221c; padding: 4px 8px; display: none; }
  #help { color: #6e6555; font-size: 12px; text-align: center; }
  #help b { color: #a89670; }
  #loading { position: absolute; inset: 0; background: #0b0b0dee; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 12px; z-index: 5; }
  #loading h2 { color: var(--gold); letter-spacing: .15em; font-size: 14px; margin: 0; }
  #loadbar { width: 300px; height: 10px; border: 1px solid #5a4a2a; background: #1a1210; }
  #loadfill { height: 100%; width: 0%; background: var(--gold); transition: width .1s; }
  #loadmsg { color: #8f8676; font-size: 12px; }
  #fallback-banner { display: none; background: #4a1a10; color: #ffb59a; padding: 4px 12px;
                     border: 1px solid #7e3a26; font-weight: 600; }
</style>
</head>
<body>
  <h1>DIABLO 2 · CAMP DES ROUSSES — Rust → WASM</h1>
  <div id="fallback-banner">MODE DÉGRADÉ : moteur WASM non chargé — fallback JS (rendu simplifié)</div>
  <div id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">
      <div class="bar" id="hpbar"><div id="hpfill"></div></div>
      <div class="hudtext" id="hptext">55/55</div>
      <div class="bar" id="mpbar"><div id="mpfill"></div></div>
      <div class="hudtext" id="mptext">15/15</div>
      <div class="hudtext" id="lvltext">Niv. 1</div>
      <div class="hudtext" id="goldtext">Or : 0</div>
      <div id="xpwrap"><div id="xpfill"></div></div>
    </div>
    <div id="loading">
      <h2>CAMP DES ROUSSES</h2>
      <div id="loadbar"><div id="loadfill"></div></div>
      <div id="loadmsg">Initialisation…</div>
    </div>
  </div>
  <div id="toolbar">
    <button id="btn-save" title="Sauvegarde la partie dans le navigateur">Sauvegarder</button>
    <button id="btn-load" title="Recharge la partie sauvegardée">Charger</button>
    <button id="btn-sound" title="Active/coupe le son">Son : oui</button>
  </div>
  <div id="status">Chargement du moteur…</div>
  <div id="msglog" style="max-width: 820px; width: 820px; max-height: 66px; overflow-y: auto; font: 11px/1.5 monospace; color: #a89670; background: #14110a; border: 1px solid #2e2718; padding: 4px 8px;"></div>
  <div id="errlog"></div>
  <div id="help"><b>Clic</b> = se déplacer · <b>Clic sur un monstre</b> = attaquer · <b>E</b> = ramasser · <b>P</b> = boire une potion</div>
  <script type="module" src="./game.js"></script>
</body>
</html>
