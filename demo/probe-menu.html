<!DOCTYPE html>
<!-- Sonde de diagnostic menu : charge menu.html en iframe, capture error +
     unhandledrejection + console.error de l'iframe, les affiche en clair dans
     le parent (lisible par lecture de texte), et clique Solo automatiquement. -->
<html lang="fr"><head><meta charset="utf-8"><title>sonde-menu</title></head>
<body style="margin:0;background:#111;color:#ff9;font:13px monospace">
<div id="log">— sonde menu —</div>
<iframe id="f" src="menu.html" style="width:100%;height:90vh;border:0"></iframe>
<script>
  const log = (m) => { document.getElementById('log').textContent += '\n' + m; };
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    const w = f.contentWindow, d = w.document;
    w.addEventListener('error', (e) => log('[error] ' + e.message + ' @' + e.filename + ':' + e.lineno));
    w.addEventListener('unhandledrejection', (e) => log('[rejection] ' + (e.reason && e.reason.message || e.reason)));
    const ce = w.console.error.bind(w.console);
    w.console.error = (...a) => { log('[console.error] ' + a.join(' ')); ce(...a); };
    log('iframe chargée, titre=' + d.title);
    setInterval(() => {
      const el = d.getElementById('errlog');
      if (el && el.textContent && el.textContent !== window.__lastErr) {
        window.__lastErr = el.textContent;
        log('[iframe errlog] ' + el.textContent.trim());
      }
    }, 500);
    setTimeout(() => {
      const btns = [...d.querySelectorAll('button')];
      log('boutons: ' + btns.map(b => b.textContent.trim()).join(' | '));
      const solo = btns.find(b => b.textContent.trim() === 'Solo');
      if (solo) { solo.click(); log('Solo cliqué'); }
      else log('BOUTON SOLO INTROUVABLE');
    }, 1500);
  });
</script></body></html>
