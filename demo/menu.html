<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diablo II — Lord of Destruction</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="stage">
  <!-- ================= Écran 1 : titre ================= -->
  <section id="screenTitle" class="screen on">
    <img id="bg" src="assets/menu/menu-bg.png" alt="">
    <div id="logo">
      <!-- frames à canvas FIXE (181×165 / 184×171) : aucune taille ne change
           entre frames, le logo ne bouge plus d'un pixel pendant l'animation -->
      <img id="logoL" src="assets/menu/logo_flame_l_00.png" width="181" height="165" alt="">
      <img id="logoR" src="assets/menu/logo_flame_r_00.png" width="184" height="171" alt="">
      <!-- repli 100 % CSS si assets/menu absent (ex : Pages sans assets) -->
      <div id="logoText" hidden>DIABLO&nbsp;II</div>
    </div>
    <nav id="buttons">
      <button class="dbtn" data-action="solo"><span>Solo</span></button>
      <button class="dbtn" data-action="continue" id="btnContinue"><span>Continuer</span></button>
      <button class="dbtn" data-action="github"><span>Projet GitHub</span></button>
      <button class="dbtn" data-action="quit"><span>Quitter</span></button>
    </nav>
  </section>

  <!-- ============ Écran 2 : sélection de héros ============
       Les cartes sont générées depuis assets/manifest.json (heroes{})
       par menu.js — aucune classe codée en dur dans ce fichier. -->
  <section id="screenSelect" class="screen">
    <div id="selectHead">Choisissez votre héros</div>
    <div id="manifestErr" hidden></div>
    <div id="heroGrid"></div>
    <div id="fireWrap">
      <div id="fireGlow"></div>
      <canvas id="fireCanvas" width="180" height="140"></canvas>
      <!-- feu 100 % CSS si fire-sheet.png absent -->
      <div id="cssFire" hidden><i></i><i></i><i></i></div>
    </div>
    <div id="selectBar">
      <label id="nameLabel" for="heroName">Nom du héros</label>
      <input id="heroName" type="text" maxlength="16" placeholder="Sans nom"
             autocomplete="off" spellcheck="false">
      <button id="play" class="dbtn" disabled><span>Jouer</span></button>
      <button id="back" class="dbtn" data-action="back"><span>Retour</span></button>
    </div>
    <div id="selectHint">Clic ou ←/→/↑/↓ : choisir &nbsp;·&nbsp; Entrée : jouer &nbsp;·&nbsp; Échap : retour</div>
  </section>

  <div id="version">version 1.12</div>
  <div id="copyright">portage non officiel — données © Blizzard Entertainment</div>
  <div id="errlog"></div>
</div>
<script src="menu.js"></script>
</body>
</html>
