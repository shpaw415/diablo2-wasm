<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diablo II — Lord of Destruction</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="stage">
  <img id="bg" src="assets/menu/menu-bg.png" alt="">
  <div id="logo">
    <img id="logoL" src="assets/menu/logo_fire_left_00.png" alt="">
    <img id="logoR" src="assets/menu/logo_fire_right_00.png" alt="">
  </div>
  <nav id="buttons">
    <button class="dbtn" data-action="solo"><span>Solo</span></button>
    <button class="dbtn" data-action="continue" id="btnContinue"><span>Continuer</span></button>
    <button class="dbtn" data-action="github"><span>Projet GitHub</span></button>
    <button class="dbtn" data-action="quit"><span>Quitter</span></button>
  </nav>
  <div id="classes" class="hidden">
    <div class="card" data-hero="BA"><img src="assets/dcc/composite.png" alt=""><span>Barbare</span></div>
    <div class="card" data-hero="SOR"><img src="assets/dcc/sor-composite.png" alt=""><span>Sorcière</span></div>
    <div class="card" data-hero="PA"><img src="assets/dcc/pal-composite.png" alt=""><span>Paladin</span></div>
    <button id="play" class="dbtn" disabled><span>Jouer</span></button>
  </div>
  <div id="version">version 1.12</div>
  <div id="copyright">portage non officiel — données © Blizzard Entertainment</div>
  <div id="errlog"></div>
</div>
<script src="menu.js"></script>
</body>
</html>
